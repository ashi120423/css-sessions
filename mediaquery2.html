<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        .grid-items {
            width: 150px;
            height: 150px;
            background-color: darkmagenta;
            margin: 5px;
        }

        @media screen and (max-width:1920px) {
            .grid-items {
                width: 400px;
            }

            .grid-container {
                margin-left: 40px;

            }
        }

        @media screen and (max-width:414px) {
            .grid-items {
                width: 130px;
                height: 130px;
                margin: 5px;
            }
            .grid-container{
            grid-template-columns: 1fr 1fr ;
            }
        }
        @media screen and (max-width:360px) {
            .grid-container{
                margin: 2px;
            }
            .grid-items{
                width:160px;
            }
        }
         @media screen and (max-width:820px) {
            .grid-items {
                width: 330px;
                margin:5px;
            }
            .grid-container{
            grid-template-columns: 1fr 1fr ;

            }
        }
           @media screen and (max-width:393px) {
            .grid-container{
            grid-template-columns: 1fr 1fr ;
                margin: 2px;
                margin-left: 40px;

            }
            .grid-items{
                width:100px;
                height: 100px;
            }
        }

    </style>
</head>

<body>
    <div class="grid-container">
        <div class="grid-items"></div>
        <div class="grid-items"></div>
        <div class="grid-items"></div>
        <div class="grid-items"></div>
    </div>

</body>

</html>
